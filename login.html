<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Login</title>
    <script>
        function pesquisarCep(cep){
            resposta.textContent = ""
            document.getElementById("rua").value = ""
            document.getElementById("bairro").value = ""
            document.getElementById("cidade").value = ""
            document.getElementById("estado").value =""

            var validacep = /^[0-9]{8}$/;

            if (validacep.test(cep)){
                const link = 'https://viacep.com.br/ws/' + cep + '/json/?callback=preencherEndereco'
            var script = document.createElement("script")
            script.src = link
            document.body.appendChild(script)
            } else  {
                resposta.textContent = "CEP digitado incorretamente!"
                document.getElementById("cep").value = ""
            }

        }
        function preencherEndereco(conteudo){
            if(!("erro" in conteudo)){
            document.getElementById("rua").value = conteudo.logradouro
            document.getElementById("bairro").value = conteudo.bairro
            document.getElementById("cidade").value = conteudo.localidade
            document.getElementById("estado").value = conteudo.uf 
            } else {
                resposta.textContent = "O CEP digitado não existe!"
            }
        }      
        function pegar_dados(){
            const dados = {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                dt_nasc: document.getElementById("dt_nasc").value,
                email: document.getElementById("email").value,
                celular: document.getElementById("celular").value,
                senha: document.getElementById("senha").value,
                cep: document.getElementById("cep").value,
                estado: document.getElementById("estado").value,
                numero: document.getElementById("numero").value,
                bairro: document.getElementById("bairro").value,
                cidade: document.getElementById("cidade").value,
                estado: document.getElementById("estado").value
            }
            return JSON.stringify(dados)
        }
        async function enviar_cadatro(){
            const dados = pegar_dados()
            try{
                const resposta = await fetch("http://10.216.243.33:3000/clientes",{
                method: "POST",
                headers:{ "Content-Type": "application/json"},
                body: dados
            })
            if (!resposta.ok) {
                alert("Erro ao cadastrar!")
            } else {
                alert("Cliente cadastrado com sucesso!")
                document.getElementById("form").reset()
            }
            
            
            } catch(error){ alert("Erro ao cadastrar" + error.message)}
        }  
    </script>
</head>
<body>
    <header>

    </header>
    <main>
        <h1>Login</h1>
        <form id="form">
            <label for="email">Email</label>
            <input type="email" id="email" required class="input_texto">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required>

            <input type="button" value="Entrar" class="btn_enviar" onclick="enviar_cadatro()">
        </form>
    </main>
    <footer>

    </footer>
</body>
</html>
